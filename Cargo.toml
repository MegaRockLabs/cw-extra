[workspace]
members = [
    "packages/*", 
    "contracts/*",
]

resolver = "2"

[workspace.package]
version    = "2.2.1"
edition    = "2021"
repository = "https://github.com/MegaRockLabs/cw-extra"
authors    = [ "Kromsten <kromsten@megarock.app>" ]
license    = "MIT"


[workspace.dependencies]
# --- reference contracts --
cw-storage-plus         = { version = "3.0.1"  }
cosmwasm-schema         = { version = "3.0.5" }
cosmwasm-std            = { version = "3.0.5" }
sha2                    = { version = "0.11.0", default-features = false }
k256                    = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
serde                   = { version = "1.0.228", default-features = false, features = ["derive"] }
schemars                = { version = "1.2.1" }
thiserror               = "2.0.18"
semver                  = "1.0.28"
cw-utils                = "3.0.0"
cw2                     = "3.0.0"


# --- 

cw22                    = { path = "packages/cw22", default-features = false, version = "2.2.1" }
cw81                    = { path = "packages/cw81", default-features = false, version = "2.2.1" }
cw82                    = { path = "packages/cw82", default-features = false, version = "2.2.1" }
cw83                    = { path = "packages/cw83", default-features = false, version = "2.2.1" }
cw84                    = { path = "packages/cw84", default-features = false, version = "2.2.1" }
types                   = { path = "packages/types", default-features = false, version = "2.2.1", package = "cw-extra-types" }
protos                  = { path = "packages/protos", version = "2.2.1", package = "cw-extra-protos" }


[profile.release.package.cw81]
codegen-units = 1
incremental = false

[profile.release.package.cw82]
codegen-units = 1
incremental = false

[profile.release.package.cw83]
codegen-units = 1
incremental = false

[profile.release.package.cw22]
codegen-units = 1
incremental = false


[profile.release]
rpath            = false
lto              = true
overflow-checks  = true
opt-level        = 3
debug            = false
debug-assertions = false
